name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "payflex_backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "payflex_backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: payflex_backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version alignée sur <java.version>17</java.version> dans payflex_backend/pom.xml
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('payflex_backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Compilation seule (rapide) avant l'étape de test.
      - name: Compile
        run: mvn -B -DskipTests compile

      # Note : si aucun test n'existe encore dans le module, mvn/Surefire ne
      # font pas échouer le build (failIfNoTests=false par défaut) — ce job
      # reste donc vert tant que les tests n'ont pas encore été ajoutés.
      - name: Run tests
        run: mvn -B test
